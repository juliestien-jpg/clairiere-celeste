name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA (version indiquée en commentaire).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Les scripts d'installation des dépendances ne s'exécutent pas.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Le site est servi sous /clairiere-celeste/ : Vite doit préfixer tous les chemins.
      - run: npm run build -w @tamagoshi/web -- --base=/clairiere-celeste/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
